# Produção: app (Next.js) + PostgreSQL + migrate (roda uma vez), isolados em
# containers próprios. O app expõe a porta APENAS em 127.0.0.1 — o nginx da VPS
# faz o proxy reverso com HTTPS (ver deploy/nginx-financeira.conf).
# Nada aqui toca os outros sites.
#
# Variáveis vêm de deploy/.env.prod (NÃO versionado). Ver deploy/README.md.
#
#   cd deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - financeira_pgdata:/var/lib/postgresql/data
    # Sem `ports:` — o banco só é acessível pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrações e SAI. Roda no ambiente completo (node_modules com a CLI
  # do Prisma), separado da imagem enxuta do app. É idempotente.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Só sobe depois que as migrações terminarem com sucesso.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Role RESTRITA (não o dono do banco): sem superpoderes, e sem permissão
      # de UPDATE/DELETE na trilha de auditoria. Ver deploy/criar-role-app.sh.
      # O hostname `db` é o do serviço, na rede interna do compose.
      DATABASE_URL: "postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      SESSION_SECRET: ${SESSION_SECRET}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      # Integrações continuam mock por padrão (ver docs/DEPLOY.md §8 para ligar reais).
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Só localhost: o nginx da VPS faz o proxy para cá. Não exposto na rede.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Agendador de rotinas: dispara os fluxos das agendas (recorrência de títulos,
  # sincronização bancária, resumo diário, régua de cobrança) nas horas locais
  # configuradas. Reaproveita a imagem `migrate` (tem node_modules + src +
  # scripts + tsx). Idempotente por construção — não duplica títulos/rotinas.
  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Mesma role restrita do app.
      DATABASE_URL: "postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: ["npx", "tsx", "scripts/scheduler.ts"]

volumes:
  financeira_pgdata:
