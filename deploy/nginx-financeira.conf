# Vhost do nginx para financeira.cetemrj.com.br (proxy reverso para o app Docker).
# Arquivo NOVO e independente — não altera os vhosts dos outros sites da VPS.
#
# Instalação na VPS:
#   sudo cp deploy/nginx-financeira.conf /etc/nginx/sites-available/financeira.conf
#   sudo ln -s /etc/nginx/sites-available/financeira.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # HTTPS (Let's Encrypt): sudo certbot --nginx -d financeira.cetemrj.com.br
#
# O certbot reescreve este arquivo para adicionar o bloco 443 + redirecionamento.

server {
    listen 80;
    listen [::]:80;
    server_name financeira.cetemrj.com.br;

    # Repassa o IP real do cliente (o app usa X-Forwarded-For no rate limit de login).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Uploads de extrato (§ importação) — o app já limita a 2 MB; folga aqui.
    client_max_body_size 8m;
}
